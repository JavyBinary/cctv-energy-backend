services:
  minio:
    image: minio/minio:latest
    container_name: cctv_minio_server
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_cctv_data:/data

volumes:
  minio_cctv_data: