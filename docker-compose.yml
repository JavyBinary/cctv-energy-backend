services:
  minio:
    image: minio/minio:latest
    container_name: cctv_minio_server
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_cctv_data:/data

  postgres:
    container_name: postgres_db
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: camera_user
      POSTGRES_PASSWORD: camera_password
      POSTGRES_DB: cameras_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    container_name: adminer_panel
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  minio_cctv_data:
  postgres_data:
