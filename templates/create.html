{% extends "base.html" %}

{% block content %}
<div class="create-screen-container">
  <div class="create-header-area">
    <h1 class="create-screen-title">Добавить модель камеры</h1>
    <div class="draft-badge">{{ camera.status }}</div>
  </div>

  <div class="media-upload-slots">
    <div class="upload-slot">
      <svg class="slot-icon" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
      <span>Фото камеры</span>
    </div>

    <div class="upload-slot">
      <svg class="slot-icon" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="23 7 16 12 23 17 23 7"></polygon>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
      </svg>
      <span>Видео камеры</span>
    </div>
  </div>

  <div class="create-fields-stack">
    <div class="form-field-unit">
      <label>Название модели</label>
      <div class="readonly-pill">{{ camera.model_name }}</div>
    </div>

    <div class="form-field-unit">
      <label>Потребляемая мощность (Вт)</label>
      <div class="readonly-pill">{{ camera.power_consumption_watts }}</div>
    </div>

    <div class="form-field-unit">
      <label>Разрешение</label>
      <div class="readonly-pill">{{ camera.resolution }}</div>
    </div>

    <div class="form-field-unit">
      <label>Тип корпуса</label>
      <div class="readonly-pill">{{ camera.housing_type }}</div>
    </div>
  </div>
</div>
{% endblock %}
