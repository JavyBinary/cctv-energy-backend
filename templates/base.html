<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расчет энергопотребления системы видеонаблюдения</title>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700|Inter:500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="mobile-frame">
    <main class="content-area">
      {% block content %}{% endblock %}
    </main>

    <nav class="camerabottomnavbar">
      <a href="/" class="nav-tab {% if active_tab == 'feed' %}active{% endif %}">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
        <span>Лента</span>
      </a>

      <a href="/create" class="nav-tab {% if active_tab == 'create' %}active{% endif %}">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="16"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
        </svg>
        <span>Добавление</span>
      </a>

      <a href="/catalog" class="nav-tab {% if active_tab == 'catalog' %}active{% endif %}">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>Плитка</span>
      </a>
    </nav>
  </div>
</body>
</html>
