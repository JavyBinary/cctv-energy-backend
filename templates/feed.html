{% extends "base.html" %}

{% block content %}
<div class="screencamerafeed-1">
  <video class="feed-media" autoplay loop muted playsinline>
    <source src="{{ camera.video_url }}" type="video/mp4">
  </video>

  <div class="camerafeedinfoblock-3">
    <p class="feed-title">{{ camera.model_name }}</p>
    <div class="camerafeedsummaryrow-5">
      <p class="feed-desc">{{ camera.description }}</p>
      <span class="feed-more">Ещё</span>
    </div>
  </div>

  <div class="feed-actions-column">
    <div class="camerafeedlikeaction-9">
      <svg class="feed-heart-icon" viewBox="0 0 24 24" fill="#FFFFFF">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      <span>{{ camera.likes_count }}</span>
    </div>

    <a href="/camera/{{ camera.id }}?next=true" class="camerafeednextaction-12">
      <svg class="feed-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>

    <div class="feed-badges-group">
      <div class="badge-pill">{{ camera.power_consumption_watts }} Вт</div>
      <div class="badge-pill">{{ camera.resolution }}</div>
    </div>
  </div>
</div>
{% endblock %}
